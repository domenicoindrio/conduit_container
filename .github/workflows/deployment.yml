name: CI/CD Pipeline

on:
  workflow_dispatch: # Allows manual trigger from Github UI
  push:
    branches: ["feature/ci-cd", "dev"]

permissions:
  contents: read
  packages: write

jobs:
  # Job 1: Build container images and push to GHRC
  build: 
    runs-on: ubuntu-latest

    strategy:
      # Stop the workflow if an error occurs
      fail-fast: true
      # Use matrix for concurrency
      matrix:
        include:
          - name: backend
            context: ./conduit-backend
          - name: frontend
            context: ./conduit-frontend
          
    steps:
    # Clone the repo code onto the runner machine granting access to the ci-cd pipeline 
    - name: Checkout Code
      uses: actions/checkout@v7

    # In case the repo name has uppercase letters
    - name: Set Lowercase Repository Name
      run: echo "REPO_LOWER=${GITHUB_REPOSITORY@L}" >> $GITHUB_ENV

    - name: Login to GitHub Container Registry (GHRC)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Images
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LOWER }}/conduit-${{ matrix.name }}:latest
          ghcr.io/${{ env.REPO_LOWER }}/conduit-${{ matrix.name }}:${{ github.sha }}

  # Job 2: Deploy to remote VM via SSH pulling Images from GHRC
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Set lowercase for this runner
      - name: Set Lowercase Repository Name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY@L}" >> $GITHUB_ENV

      - name: SCP Compose File to the VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app"

      # SSH into VM, inject and set .env, pull images from GHRC, restart containers, healtcheck
      - name: Deploy and Auto-Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p ~/app
            cd ~/app

            # 1. Save current running tags for potential rollback
            WORKING_TAG=$(docker inspect --format='{{.Config.Image}}' conduit-backend 2>/dev/null | cut -d':' -f2)
            WORKING_TAG=${WORKING_TAG:-latest}

            # 2. Write production .env file from secrets
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF
            
            # 3. Append lowercased repo using env.REPO_LOWER
            echo "GITHUB_REPOSITORY=${{ env.REPO_LOWER }}" >> .env

            # 4. Dynamically append the Allowed Hosts including the production address and restrict permits
            echo "ALLOWED_HOSTS=${{ secrets.VM_HOST }},localhost,127.0.0.1,backend" >> .env
            chmod 600 .env

            # 5. Login Docker to GHCR from the VM using GITHUB_TOKEN
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 6. Attempt Deployment using the explicit commit SHA
            echo "Pulling new images..."
            IMAGE_TAG=${{ github.sha }} docker compose pull

            echo "Starting deployment..."
            if ! IMAGE_TAG=${{ github.sha }} docker compose up -d --wait --remove-orphans; then
              echo "Deployment failed! Auto-rollback to working tag $WORKING_TAG..."
              
              # Execute Rollback
              IMAGE_TAG=$WORKING_TAG docker compose up -d --remove-orphans
              
              # Fail the Github Action Job
              exit 1
            else
              echo "No problems detected! Deployment successful."
            fi